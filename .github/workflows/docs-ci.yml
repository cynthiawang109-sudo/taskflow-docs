name: docs-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.md"
      - "tools/check_docs.py"
      - ".github/workflows/docs-ci.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Consistency checks (SUMMARY, internal links, README coverage)
        run: python tools/check_docs.py

  external-links:
    # Informational only: outside sites flake, rate-limit, and move.
    # The job reports dead links without blocking the docs gate.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: External link check (non-blocking)
        run: python tools/check_docs.py --external-only
